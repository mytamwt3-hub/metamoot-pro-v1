<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mytal</title><style>body{background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif}.card{background:#1e293b;padding:25px;border-radius:20px;width:92%;max-width:360px}h1{text-align:center;color:#38bdf8}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.a{background:#38bdf8;color:#000}.i{background:#334155;color:#fff}input{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:0;background:#334155;color:#fff;box-sizing:border-box}.btn{width:100%;padding:11px;border:0;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}.b1{background:#38bdf8}.b2{background:#fff;color:#000}</style></head><body><div class="card"><h1>mytal منصة أعمال</h1><div class="tabs"><button id="b1" class="a" onclick="t('b')">تجاري 🏢</button><button id="b2" class="i" onclick="t('p')">شخصي 👤</button></div><div id="bf"><input placeholder="اسم الشركة"><input placeholder="السجل التجاري"></div><input placeholder="الايميل"><input type="password" placeholder="كلمة المرور"><button class="btn b1" onclick="location.href='../index.html'">دخول</button><button class="btn b2">الدخول بجوجل 🔵</button></div><script>function t(x){b1.className=x=='b'?'a':'i';b2.className=x=='p'?'a':'i';bf.style.display=x=='b'?'block':'none'}</script></body></html>
